<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六年級單字造成語產生器</title>
    <style>
        body {
            font-family: "微軟正黑體", Arial, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            padding: 30px;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 120px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #3498db;
            border-radius: 8px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result-box {
            background-color: #eef7fe;
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 20px;
            min-height: 100px;
        }
        .chengyu-item {
            font-size: 24px;
            font-weight: bold;
            color: #27ae60;
            margin: 8px 0;
            letter-spacing: 2px;
        }
        .no-result {
            color: #e74c3c;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔤 單字造成語產生器</h1>
    <p>請輸入一個字，幫你找出包含這個字的六年級成語：</p>

    <div class="input-group">
        <input type="text" id="charInput" maxlength="1" placeholder="輸入一字">
        <button onclick="makeChengyu()">造成語</button>
    </div>

    <div class="result-box" id="resultBox">
        <div style="color: #7f8c8d;">請輸入文字並點擊「造成語」</div>
    </div>
</div>

<script>
    // 六年級常用成語資料庫
    const chengyuList = [
        "胸有成竹", "畫蛇添足", "半途而廢", "井底之蛙", "井井有條", 
        "同心協力", "鍥而不捨", "風和日麗", "破釜沉舟", "守株待兔", 
        "溫故知新", "自相矛盾", "雪中送炭", "飲水思源", "集思廣益", 
        "同舟共濟", "全力以赴", "竹報平安", "鳥語花香", "水落石出"
    ];

    function makeChengyu() {
        const inputChar = document.getElementById("charInput").value.trim();
        const resultBox = document.getElementById("resultBox");

        if (inputChar === "") {
            alert("請先輸入一個字喔！");
            return;
        }

        // 搜尋包含輸入字的成語
        const matched = chengyuList.filter(item => item.includes(inputChar));

        if (matched.length > 0) {
            let htmlContent = `<p style="color:#2c3e50; font-weight:bold;">包含「${inputChar}」的成語：</p>`;
            matched.forEach(item => {
                htmlContent += `<div class="chengyu-item">${item}</div>`;
            });
            resultBox.innerHTML = htmlContent;
        } else {
            // 如果資料庫找不到，自動組合創意成語
            const autoCreated = inputChar + "山" + inputChar + "海";
            resultBox.innerHTML = `
                <div class="no-result">成語庫暫無收錄，為你組合創意成語：</div>
                <div class="chengyu-item">${autoCreated}</div>
            `;
        }
    }
</script>

</body>
</html>
